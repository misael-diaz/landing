    <script type="module">
    {
      // NOTE: prevents event-bubbling from children https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling
      function onOnClickListener(e) {
	const div = this.children[1];
	if ("LI" === e.target.tagName) {
	  e.stopPropagation();
	  return;
	}
	div.classList.toggle('dropdown');
      }
      const series = document.getElementById("series-dropdown");
      series.addEventListener("click", onOnClickListener);
    }
    </script>
