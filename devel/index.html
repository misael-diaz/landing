<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
      .hidden {
	content-visibility: hidden;
      }
      .visible {
	content-visibility: visible;
      }
      .required {
	text-decoration: red wavy underline;
      }
    </style>
    <script type="module"> 
    {
      // NOTE: embedding the script is the way to go if you want to test locally without a http server and that's my thing at this point
      const div = document.getElementById("div");
      const dialog = document.getElementById("dialog");
      const openButton = document.getElementById("open");
      const closeButton = document.getElementById("close");
      const name = document.getElementById("name");
      const email = document.getElementById("email");
      const labelName = document.getElementById("label-name");
      const labelEmail = document.getElementById("label-email");
// NOTE: has the side-effect of hiding the subcribe button on clicking
      openButton.addEventListener("click", () => {
	dialog.showModal();
	// removing "visible" from the class list leaves "hidden" as the only element in the list and so the `div` becomes invisible along everything it contains, see for instance https://developer.mozilla.org/en-US/docs/Web/API/Element/classList
	div.classList.remove("visible");
    });
// NOTE: setting the closedby attribute of the dialog element to "none" means that the event listener is responsible for closing the dialog
      closeButton.addEventListener("click", () => {
	if (name.value && email.value) {
	  labelName.classList.remove("required");
	  labelEmail.classList.remove("required");
	  setTimeout(()=>{
	      dialog.close();
	  }, 1000);
	}
	else {
	  if (!name.value) {
	    labelName.classList.add("required");
	  }
	  else {
	    labelName.classList.remove("required");
	  }
	  if (!email.value) {
	    labelEmail.classList.add("required");
	  }
	  else {
	    labelEmail.classList.remove("required");
	  }
	}
      });
    }
    </script>
    <title>Landing Page</title>
  </head>
  <body>
    <dialog id="dialog" closedby="none">
      <form method="dialog">
	<p>
	  <label for="name" id="label-name">Name:</label>
	  <input type="text" name="name" id="name" autocomplete="on" required/>
	</p>
	<p>
	  <label for="email" id="label-email">Email:</label>
	  <input type="email" name="email" id="email" autocomplete="on" required/>
	</p>
	<p>
	  <button id="close" type="button">Submit</button>
	</p>
      </form>
    </dialog>
    <div class="hidden visible" id="div">
      <button id="open" type="button">Subscribe</button>
    </div>
  </body>
</html>
